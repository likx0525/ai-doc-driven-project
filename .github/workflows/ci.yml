name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest
      - run: python scripts/clean_runtime_artifacts.py
      - run: python packages/zh/bin/validate_skill_package.py --root packages/zh
      - run: python packages/en/bin/validate_skill_package.py --root packages/en --english
